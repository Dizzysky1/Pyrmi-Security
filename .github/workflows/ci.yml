name: CI

# Repo-level guardrails. This is CI only — it does not deploy to Cloudflare or Vercel.
# The no-python step would have caught the two leftover api/*.py files before they ever reached a deploy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: No Python or disallowed files under api/ and worker/
        run: node scripts/check-no-python.js
      - name: Browser SDK build is up to date
        run: node scripts/build-sdk.js --check
      - name: Stage Cloudflare assets and dry-run Worker bundle
        run: |
          node scripts/build-cf.js
          npx --no-install wrangler deploy --dry-run
      - name: Tests (production key prefix)
        run: node --test tests/*.test.js
        env:
          PYRMI_KV: memory
          PYRMI_KV_PREFIX: 'live:'
